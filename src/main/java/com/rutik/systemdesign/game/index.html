<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LORA — Learn Often, Recall Always</title>
  <script>
    // Apply the saved colour theme + light/dark mode before first paint (no flash).
    // ?theme=<id> overrides the colour for quick previews without touching the saved pick.
    var _t = new URLSearchParams(location.search).get("theme") ||
      localStorage.getItem("sd_theme") || "midnight";
    var _m = localStorage.getItem("sd_theme_mode");
    if (_t === "daylight") { _t = "midnight"; if (!_m) _m = "light"; }   // migrate retired daylight
    if (!/^(midnight|ocean|forest|ember|fire|rose|orchid|obsidian)$/.test(_t)) _t = "midnight";
    document.documentElement.dataset.theme = _t;
    document.documentElement.dataset.mode = (_m === "light") ? "light" : "dark";
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%2306070d'/%3E%3Cline x1='296' y1='256' x2='392' y2='222' stroke='%23f59e0b' stroke-width='20'/%3E%3Cline x1='140' y1='256' x2='200' y2='256' stroke='%238b9dff' stroke-width='18'/%3E%3Cpolygon points='244,204 296,256 244,308 192,256' fill='%230c101f' stroke='%238b9dff' stroke-width='18' stroke-linejoin='round'/%3E%3Ccircle cx='118' cy='256' r='28' fill='%238b9dff'/%3E%3Ccircle cx='392' cy='222' r='32' fill='%23fbbf24'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- static fallback only; syncThemeColor() in app.js sets this from the live --bg -->
  <meta name="theme-color" content="#0d1022" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="mesh m1"></div><div class="mesh m2"></div><div class="mesh m3"></div>
  </div>

  <header class="topbar">
    <div class="brand" id="brandHome" role="button" tabindex="0" title="Home" aria-label="LORA — go to home screen">LORA<span class="byline">by Rutik</span></div>
    <div class="stats">
      <button id="streakChip" class="daychip" title="Streak, level and XP &middot; click for detail" aria-haspopup="true" aria-expanded="false">
        <svg class="icon i-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg><b id="streakVal">0</b>
        <span class="dc-sep" aria-hidden="true"></span>
        <span class="dc-lvl">Lv&nbsp;<b id="lvlVal">1</b> &middot; <b id="lvlTitle">Intern</b></span>
      </button>
      <button id="moreBtn" class="ghost icon" aria-label="More options" aria-haspopup="dialog" title="More options"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <!-- screens injected here -->
    <div class="loading">Loading your question bank&hellip;</div>
  </main>

  <div id="live" class="sr-only" role="status" aria-live="polite"></div>


  <nav id="rail" class="rail" aria-label="Primary"></nav>
  <nav id="tabbar" class="tabbar" aria-label="Primary"></nav>

  <script src="app.js"></script>
</body>
</html>
